server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: stockpilot
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockpilot}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USERNAME:stockpilot}
    password: ${DB_PASSWORD:stockpilot}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Set JPA_DDL_AUTO=validate to also assert entity/schema alignment.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    # Demo data lives in db/seed and is only loaded when FLYWAY_LOCATIONS includes it.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  data:
    web:
      pageable:
        max-page-size: 200
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:}            # REQUIRED, at least 32 characters. Never commit a real value.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  timezone: ${APP_TIMEZONE:UTC}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
