# Render Blueprint: https://render.com/docs/blueprint-spec
# 1) Push the repo to GitHub  2) Render dashboard -> New -> Blueprint -> select the repo
# 3) After the first deploy, set CORS_ALLOWED_ORIGINS (backend) and VITE_API_URL (frontend) to the real URLs, redeploy both.
databases:
  - name: stockpilot-db
    plan: free
    databaseName: stockpilot
    user: stockpilot

services:
  - type: web
    name: stockpilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: stockpilot-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: stockpilot-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: stockpilot-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: stockpilot-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: stockpilot-db, property: password }
      - key: JWT_SECRET
        generateValue: true          # Render generates a random value; it is never in the repo
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # set to your static site URL, e.g. https://stockpilot-web.onrender.com
      - key: FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/seed   # DEMO: remove ",classpath:db/seed" for a real deployment
      - key: APP_TIMEZONE
        value: UTC

  - type: web
    name: stockpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false                  # set to the API URL, e.g. https://stockpilot-api.onrender.com
    routes:
      - type: rewrite                # SPA fallback for React Router
        source: /*
        destination: /index.html
