# Render Blueprint: https://render.com/docs/blueprint-spec
# Production-oriented defaults. Choose durable paid infrastructure before storing business records.
databases:
  - name: stockpilot-db
    plan: free
    databaseName: stockpilot
    user: stockpilot

services:
  - type: web
    name: stockpilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: stockpilot-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: stockpilot-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: stockpilot-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: stockpilot-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: stockpilot-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FLYWAY_LOCATIONS
        value: classpath:db/migration
      - key: APP_TIMEZONE
        value: Asia/Phnom_Penh
      - key: JPA_DDL_AUTO
        value: validate

  - type: web
    name: stockpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
