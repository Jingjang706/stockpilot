# Local development / demo stack:  docker compose up --build
# Frontend: http://localhost:5173   API: http://localhost:8080   Swagger UI: http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockpilot_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: stockpilot
      DB_USERNAME: stockpilot
      DB_PASSWORD: ${DB_PASSWORD:-stockpilot_dev_password}
      DB_SSLMODE: disable
      # Development-only secret. Generate your own for anything else: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Loads the demo users/products/sales. Remove the seed location for a clean database.
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
